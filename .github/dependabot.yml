# Dependency updates as pull requests (NFR-SEC-07), which CI then checks like any other change.
# Nothing here merges anything: a person reads the pull request and merges it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      # One pull request a week for everything that stays inside its major version. A new major
      # comes on its own, to be read on its own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # `postgres` is patched in place (patches/postgres@3.4.9.patch, pnpm-workspace.yaml): the
      # patch is what lets the driver run with pipelining off (src/lib/db/index.ts), which is what
      # stopped the production time-outs behind Supabase's pooler, and it is written against
      # 3.4.9's source. A newer version would install without it — or fail to install — so it is
      # pinned exactly in package.json and moved by hand, with the patch redone and production
      # watched, never by a bot.
      - dependency-name: postgres

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
