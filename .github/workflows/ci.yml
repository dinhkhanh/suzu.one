name: CI

# Pull requests only. A pull request's run tests the merge result (`refs/pull/N/merge`), branch
# protection requires the branch to be up to date with main before it merges and lets nobody push
# to main around a pull request — so what lands on main is what ran here, and production deploys
# without a second run on main (docs/RELEASE_PLAN.md §3).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA, with the release it is in a comment: a tag
# can be moved to other code, a commit cannot. Dependabot (.github/dependabot.yml) proposes the
# next SHA and keeps the comment in step.
jobs:
  # `pnpm check` (format, types, lint, tests) and `pnpm build`, split so they run side by side:
  # in one job they took 13 minutes (October 2026), 8 of them the tests. Setup is ~20 s a job.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known vulnerabilities in what ships to production (NFR-SEC-07).
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm typecheck
      # Includes the module boundaries.
      - run: pnpm lint

  # The tests run every migration on an in-process Postgres (PGlite) and include the
  # permission-matrix suite; four shards of the files, each on its own runner.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --shard=${{ matrix.shard }}/4

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Next's build cache from the last run on this branch, else main's: most modules are unchanged.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            next-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.head_ref || github.ref_name }}-
            next-build-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
        env:
          # Placeholders: the build never connects to anything, it only needs the variables to exist.
          POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          BETTER_AUTH_SECRET: ci-placeholder-secret-ci-placeholder-secret
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci

  # The one result branch protection asks for: green only when every part above is. Kept under the
  # name the whole job had, so the protection rule did not change when the job was split.
  check:
    if: always()
    needs: [static, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        run: |
          echo "static=${{ needs.static.result }} test=${{ needs.test.result }} build=${{ needs.build.result }}"
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.test.result }}" = success ] && [ "${{ needs.build.result }}" = success ]

  # The smoke suite (e2e/, NFR-MNT-04): the seven critical journeys in a real browser, against the
  # built app and a real Postgres reached through a transaction-mode pooler (PgBouncer standing in
  # for Supabase's Supavisor) — the path the PGlite tests never take. Both databases are service
  # containers that live and die with this job: nothing here reaches staging or production.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Postgres 17 (Supabase's major version) with pgvector, which the migrations create.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          # The pooler logs in on the job's private network only; clients still give a password to it.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      pooler:
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: postgres
          POOL_MODE: transaction
          MAX_CLIENT_CONN: "200"
          DEFAULT_POOL_SIZE: "20"
        ports: ["6432:5432"]
    env:
      # The app goes through the pooler; migrations, the seed and the suite's own session rows go direct.
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:6432/postgres
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      E2E_THROWAWAY_DATABASE: "1"
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      ALLOWED_WORKSPACE_DOMAINS: suzu.vn,suzu.group
      CSP_MODE: report-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Throwaway keys, made for this run and gone with it: nothing to leak, nothing for the secret scan to find.
      - name: Generate this run's secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEYS=e2e:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "DATA_BLIND_INDEX_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Wait for the pooler
        run: for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 6432 && exit 0; sleep 2; done; exit 1
      - run: pnpm db:migrate
      # The demo company: people on both domains, managers, an entity with a month to lock, obligations.
      - run: pnpm db:seed && pnpm db:seed:demo
      # Its own cache: this build has other variables than the `build` job's.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            next-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.head_ref || github.ref_name }}-
            next-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Secrets in what was just committed (NFR-SEC-07): every commit of the push or the pull request
  # is scanned, so a key that was added and removed again in a later commit is still found. What
  # the scanner may ignore is listed, with the reason, in .gitleaks.toml.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan reads commits, not the checked-out tree: it needs the history.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Read-only here (see `permissions` above): used to list a pull request's commits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # The scanner itself, pinned like the action that downloads it.
          GITLEAKS_VERSION: 8.30.1
          # Commenting on the pull request would need write access; the failed check says enough.
          GITLEAKS_ENABLE_COMMENTS: "false"
